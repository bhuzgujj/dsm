<div class="flex flex-col bg-gray-800 m-2 p-2 rounded-md">
    <div class="flex justify-between bg-gray-700 mb-2 p-2 rounded-md">
        <button class="bg-green-600  hover:bg-green-400 py-1 px-2 rounded-md">New</button>
    </div>
    <table class="w-full">
        <tr>
            <th class="bg-gray-700 mb-2 p-2 rounded-l-md w-2/5 text-left">Name</th>
            <th class="bg-gray-700 p-2 w-1/5">Version</th>
            <th class="bg-gray-700 p-2 rounded-r-md w-2/5">Classes</th>
        </tr>
        <ng-container *ngIf="datasets.length > 0">
            <tr>
                <td class="p-0.5"></td>
            </tr>
            <tr *ngFor="let dataset of datasets" (click)="select(dataset)">
                <td class="bg-gray-700 p-2 rounded-l-md">{{dataset.metadata.name}}</td>
                <td class="bg-gray-700 p-2">v{{dataset.metadata.version}}</td>
                <td class="bg-gray-700 p-2 rounded-r-md">
                    <div *ngIf="selected  === dataset">
                        <table>
                            <tr>
                                <th>Id</th>
                                <th>Classes</th>
                                <th>Count</th>
                            </tr>
                            <tr *ngFor="let id of Object.keys(dataset.metadata.classes)">
                                <th>{{id}}</th>
                                <th>{{dataset.metadata.classes[+id].class}}</th>
                                <th>{{countSet(dataset, +id)}}</th>
                            </tr>
                        </table>
                    </div>
                    <div *ngIf="selected  !== dataset">
                        Count: {{Object.keys(dataset.metadata.classes).length}}
                    </div>
                </td>
            </tr>
        </ng-container>
        <ng-container *ngIf="datasets.length === 0">
            <tr>
                <td class="p-0.5"></td>
            </tr>
            <tr>
                <td colspan="3" class="bg-gray-700 p-2 rounded-md text-center text-gray-300">None</td>
            </tr>
        </ng-container>
    </table>
</div>
