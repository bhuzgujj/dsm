name: msi.yml

on:
  push:
    branches:
      - release

jobs:
  build-msi:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Cli
        run: cargo build --workspace --release

      - name: Npm Install
        working-directory: gui
        run: npm i

      - name: Build Gui
        working-directory: gui
        run: npm run tauri build -- --release

      - name: Upload Msi
        uses: actions/upload-artifact@v4
        with:
          name: DataSets-Manager
          retention-days: 5
          path: |
            target/release/bundle/msi/*.msi