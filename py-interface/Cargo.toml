[package]
name = "pyidsm"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "pyidsm"
crate-type = ["cdylib"]

[dependencies]
# Internal
interfaces.workspace = true
serializer.workspace = true
storage.workspace = true

# External
anyhow.workspace = true
log.workspace = true

pyo3 = { workspace = true, features = ["extension-module", "serde", "anyhow", "experimental-async"] }
