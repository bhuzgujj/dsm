[workspace]
resolver = "2"
members = [
    "libs/interfaces",
    "libs/serializer",
    "libs/storage",
    "gui/src-tauri",
    "cli",
]

[workspace.dependencies]
# Internal
interfaces = { path = "./libs/interfaces" }
serializer = { path = "./libs/serializer" }
storage = { path = "./libs/storage" }

# External
anyhow = "1.0.98"

chrono = "0.4.41"
clap = { version = "4.5.38", features = ["derive"] }

dirs = "6.0.0"

image = "0.25.6"

log = "0.4.27"

serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
surrealdb = "2.3.2"

tokio = "1.45.0"
toml = "0.8.22"
