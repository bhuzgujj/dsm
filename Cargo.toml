[workspace]
members = [
  "libs/interfaces",
  "libs/serializer",
  "libs/storage",
  "gui/src-tauri",
  "cli",
  "pyidsm",
]
resolver = "2"

[workspace.dependencies]
# Internal
interfaces = {path = "./libs/interfaces"}
serializer = {path = "./libs/serializer"}
storage = {path = "./libs/storage"}

# External
anyhow = "1.0.98"

chrono = "0.4.41"
clap = {version = "4.5.38", features = ["derive"]}
colored = "3.0.0"

dirs = "6.0.0"

futures = "0.3"

image = "0.25.6"

log = "0.4.27"

pyo3 = "0.25.0"
pyo3-stub-gen = "0.12.1"
pyo3-stub-gen-derive = "0.12.1"

reqwest = "0.12.15"

serde = {version = "1.0.219", features = ["derive"]}
serde_json = "1.0.140"

tokio = "1.45.0"
toml = "0.9.5"
